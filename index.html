<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/imdb-heatmap-logo.png" />
    <link rel="apple-touch-icon" href="/imdb-heatmap-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IMDb heatmaps for TV shows episode ratings" />
    <meta name="theme-color" content="#1a1a19" />
    <title>IMDb Heatmap</title>
    <script>
      // Apply the saved theme and palette before the page paints, so there's no flash of the defaults.
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#fcfcfb'
        }
        if (localStorage.getItem('palette') === 'blue') {
          document.documentElement.dataset.palette = 'blue'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
